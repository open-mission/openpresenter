[workspace]
members = ["crates/op-core", "crates/op-db", "crates/op-admin"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
directories = "6.0"
flate2 = "1.0"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
mime_guess = "2.0"
muda = "0.21"
op-core = { path = "crates/op-core" }
op-db = { path = "crates/op-db" }
open = "5.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
ring = "0.17"
rusqlite = { version = "0.40", features = ["bundled-full"] }
rusqlite_migration = "2.6"
rust-embed = "8.5"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tao = "0.37"
tar = "0.4"
tempfile = "3.0"
thiserror = "2.0"
tokio = { version = "1.44", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.26"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
