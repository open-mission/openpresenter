name: Docker Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag manual para a imagem (ex: latest, v0.6.1)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform-id: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform-id: linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}-${{ matrix.platform-id }}
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/openpresenter:{1}-{2}', secrets.DOCKERHUB_USERNAME, github.sha, matrix.platform-id) || '' }}
          cache-from: type=gha,scope=build-${{ matrix.platform-id }}
          cache-to: type=gha,scope=build-${{ matrix.platform-id }},mode=max

  merge:
    name: Merge Multi-Arch Manifests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for GHCR
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

      - name: Extract Docker metadata for Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        id: meta-dockerhub
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/openpresenter
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Create and push manifest for GHCR
        env:
          TAGS: ${{ steps.meta-ghcr.outputs.tags }}
        run: |
          images=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              images+=( "--tag" "$tag" )
            fi
          done <<< "$TAGS"

          docker buildx imagetools create "${images[@]}" \
            ghcr.io/${{ github.repository }}:${{ github.sha }}-linux-amd64 \
            ghcr.io/${{ github.repository }}:${{ github.sha }}-linux-arm64

      - name: Create and push manifest for Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TAGS: ${{ steps.meta-dockerhub.outputs.tags }}
        run: |
          images=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              images+=( "--tag" "$tag" )
            fi
          done <<< "$TAGS"

          docker buildx imagetools create "${images[@]}" \
            ${DOCKERHUB_USERNAME}/openpresenter:${{ github.sha }}-linux-amd64 \
            ${DOCKERHUB_USERNAME}/openpresenter:${{ github.sha }}-linux-arm64

      - name: Inspect GHCR multi-arch image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta-ghcr.outputs.version }}
