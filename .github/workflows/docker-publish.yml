name: Docker Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag manual para a imagem (ex: latest, v0.6.0)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            platform-id: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            platform-id: linux-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build outputs
        id: prepare-outputs
        run: |
          OUTPUTS="type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true"
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            OUTPUTS="${OUTPUTS}
          type=image,name=${{ secrets.DOCKERHUB_USERNAME }}/openpresenter,push-by-digest=true,name-canonical=true,push=true"
          fi
          echo "outputs<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: ${{ steps.prepare-outputs.outputs.outputs }}
          cache-from: type=gha,scope=build-${{ matrix.platform-id }}
          cache-to: type=gha,scope=build-${{ matrix.platform-id }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform-id }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Multi-Arch Manifests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata for GHCR
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}

      - name: Extract Docker metadata for Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        id: meta-dockerhub
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/openpresenter
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Create and push manifest for GHCR
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta-ghcr.outputs.tags }}
        run: |
          images=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              images+=( "--tag" "$tag" )
            fi
          done <<< "$TAGS"

          platforms=()
          for digest in *; do
            if [ -f "$digest" ]; then
              platforms+=( "ghcr.io/${{ github.repository }}@sha256:$digest" )
            fi
          done

          docker buildx imagetools create "${images[@]}" "${platforms[@]}"

      - name: Create and push manifest for Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        working-directory: /tmp/digests
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TAGS: ${{ steps.meta-dockerhub.outputs.tags }}
        run: |
          images=()
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              images+=( "--tag" "$tag" )
            fi
          done <<< "$TAGS"

          platforms=()
          for digest in *; do
            if [ -f "$digest" ]; then
              platforms+=( "${DOCKERHUB_USERNAME}/openpresenter@sha256:$digest" )
            fi
          done

          docker buildx imagetools create "${images[@]}" "${platforms[@]}"

      - name: Inspect GHCR multi-arch image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta-ghcr.outputs.version }}
