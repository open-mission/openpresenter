name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release a publicar/atualizar (ex: v0.3.0)'
        required: false
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }} - ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: open-presenter.exe
            archive_name: open-presenter-windows-x64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: open-presenter
            archive_name: open-presenter-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            binary_name: open-presenter
            archive_name: open-presenter-macos-x64.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: open-presenter
            archive_name: open-presenter-linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Frontend Svelte
        run: |
          cd frontend
          bun install
          bun run build
          cd ..

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libappindicator3-dev librsvg2-dev libx11-dev libasound2-dev

      - name: Build Rust Binary (Release)
        run: cargo build --release --locked --target ${{ matrix.target }} --package op-admin

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist-package
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination "dist-package/${{ matrix.binary_name }}"
          Compress-Archive -Path "dist-package/*" -DestinationPath "${{ matrix.archive_name }}"

      - name: Package Binary (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir dist-package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "dist-package/${{ matrix.binary_name }}"
          tar -czvf "${{ matrix.archive_name }}" -C dist-package "${{ matrix.binary_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive_name }}
          path: ${{ matrix.archive_name }}

  release:
    name: Publish Official GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag || 'v0.3.0' }}
          files: release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
