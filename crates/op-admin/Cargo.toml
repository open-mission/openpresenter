[package]
name = "op-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "open-presenter"
path = "src/main.rs"

[features]
default = ["tray"]
tray = ["dep:muda", "dep:open", "dep:tao", "dep:tray-icon"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
directories.workspace = true
flate2.workspace = true
futures-util.workspace = true
image.workspace = true
mime_guess.workspace = true
muda = { workspace = true, optional = true }
op-core.workspace = true
op-db.workspace = true
open = { workspace = true, optional = true }
reqwest.workspace = true
ring.workspace = true
rust-embed.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = "0.40.1"
tao = { workspace = true, optional = true }
tar.workspace = true
tempfile.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tray-icon = { workspace = true, optional = true }
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
